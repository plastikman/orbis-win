d3d9.maxAvailableMemory = 256

# 32-bit DXVK keeps managed textures in 64 MiB anonymous sections (SHM_ANON on this
# server) and maps 1 MiB views. Those views fail here (mmap EINVAL, then WP/1024 private
# copy or ESPIPE pread). 0 keeps textures in DXVK's own memory: no sections, no views.
d3d9.textureMemory = 0
