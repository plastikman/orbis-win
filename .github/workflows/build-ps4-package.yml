name: Build PS4 package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ps4-package-build
  cancel-in-progress: false

jobs:
  package:
    runs-on: orbis-win-build
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang-19 lld-19 llvm-19 cmake ninja-build glslang-tools \
            lftp git python3 curl pkg-config bison flex perl gcc-mingw-w64-x86-64 \
            gcc-mingw-w64-i686 g++-mingw-w64-i686
          for tool in clang clang++ lld ld.lld llvm-ar llvm-ranlib llvm-nm \
                      llvm-objcopy llvm-readelf llvm-strip; do
            sudo ln -sfn "/usr/bin/${tool}-19" "/usr/local/bin/$tool"
          done
          clang --version
          ld.lld --version

      - name: Attach private build cache
        run: scripts/ci/prepare-runner.sh

      - name: Check build prerequisites
        run: scripts/prereqs.sh

      - name: Build relocatable split-runtime package
        env:
          TITLE_ID: GLDS10044
          TITLE: Prospero Wine PS4
          PW_SPLIT_RUNTIME: "1"
          PW_SHARED_LIBC: "1"
          WOW64NATIVE_ABI: "3"
          PW_MODULE_STUBS_DIR: ${{ github.workspace }}/build/openorbis-module-stubs
          PS4_PKGTOOL_OPENSSL_LIB: /orbis-cache/deps/openssl11/lib
          PKG_OUT: ${{ runner.temp }}/orbis-win-app
          PKG_BASE_OUT: ${{ runner.temp }}/orbis-win-base
        run: |
          set -euo pipefail
          scripts/sync-toolchain.sh
          scripts/build-openorbis-module-stubs.sh
          make -C prospero-win/.deps/wine-ps5/build -j4 dlls/ntdll/ntdll.so
          scripts/prx-ps4.sh
          cp /orbis-cache/deps/build/orbw00053-iret-selectors-wow64native/x86_64-unix/wow64native.prx \
            prospero-win/.deps/wine-ps5/prx/sce_module/wow64native.prx
          test "$(sha256sum prospero-win/.deps/wine-ps5/prx/sce_module/wow64native.prx | cut -d' ' -f1)" \
            = e486fc5d126baa4d87fb3921dadf70b437952279ca66d3c1e7d8449ebaf5a506
          scripts/radv-prx-ps4.sh
          scripts/freetype-prx-ps4.sh
          scripts/wineps5-prx-ps4.sh
          scripts/build-relocatable-wine-ps4.sh

      - name: Collect packages and record provenance
        env:
          PW_MODULE_STUBS_DIR: ${{ github.workspace }}/build/openorbis-module-stubs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/orbis-win-artifacts"
          app_pkg=$(find "$RUNNER_TEMP/orbis-win-app" -maxdepth 1 -type f -name '*.pkg' -print -quit)
          base_pkg=$(find "$RUNNER_TEMP/orbis-win-base" -maxdepth 1 -type f -name '*.pkg' -print -quit)
          test -s "$app_pkg" && test -s "$base_pkg"
          cp "$app_pkg" "$RUNNER_TEMP/orbis-win-artifacts/"
          cp "$base_pkg" "$RUNNER_TEMP/orbis-win-artifacts/base-$(basename "$base_pkg")"
          {
            echo "root_commit=$(git rev-parse HEAD)"
            echo "root_ref=${GITHUB_REF}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "module_stub_source=OpenOrbis-PS4-Toolchain@0a1aaf9dd4a92695538bdeb09fb056d06dd11725 (GPL-3.0)"
            echo "libc_stub_sha256=$(sha256sum "$PW_MODULE_STUBS_DIR/libc.prx" | cut -d' ' -f1)"
            echo "fios2_stub_sha256=$(sha256sum "$PW_MODULE_STUBS_DIR/libSceFios2.prx" | cut -d' ' -f1)"
            echo "wine_commit=$(git -C prospero-win rev-parse HEAD)"
            echo "wine_dirty_diff_sha256=$(git -C prospero-win diff --binary | sha256sum | cut -d' ' -f1)"
            echo "mesa_commit=$(git -C mesa-build/mesa-ps4 rev-parse HEAD)"
            echo "mesa_dirty_diff_sha256=$(git -C mesa-build/mesa-ps4 diff --binary | sha256sum | cut -d' ' -f1)"
            echo "app_pkg_sha256=$(sha256sum "$app_pkg" | cut -d' ' -f1)"
            echo "base_pkg_sha256=$(sha256sum "$base_pkg" | cut -d' ' -f1)"
          } > "$RUNNER_TEMP/orbis-win-artifacts/BUILD-MANIFEST.txt"
          cat "$RUNNER_TEMP/orbis-win-artifacts/BUILD-MANIFEST.txt"

      - uses: actions/upload-artifact@v4
        with:
          # Branch names can contain '/', which is not valid in artifact names.
          name: orbis-win-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/orbis-win-artifacts/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
