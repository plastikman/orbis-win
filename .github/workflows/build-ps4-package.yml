name: Build PS4 package

on:
  workflow_dispatch:
    inputs:
      title_id:
        description: Title ID (GLDS10043 is the test slot; GLDS10044 holds the promoted baseline)
        default: GLDS10043
      title:
        description: Title shown on the console
        default: Orbis Wine ABI-v4
      version:
        description: >-
          APP_VER as NN.NN (e.g. 01.08). Required, no default: use a number never
          used before for this title ID, always increasing, so the console shows
          which build is installed (01.07 = local CI-recipe test, 2026-11-05).
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ps4-package-build
  cancel-in-progress: false

jobs:
  package:
    runs-on: orbis-win-build
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          # ⚠ THE SAME LLVM POINT RELEASE AS THE BUILD WORKSTATION (Debian 19.1.7).
          # wow64native.prx and the PRX platform units are compiled on every
          # build, so Ubuntu's 19.1.1 produced different machine code and
          # build-abi4-package.sh refused the wow64native pin (run 42143721908).
          # apt.llvm.org's 19.1.7 is built from the same llvmorg-19.1.7 commit.
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key |
            sudo tee /etc/apt/keyrings/apt.llvm.org.asc >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" |
            sudo tee /etc/apt/sources.list.d/llvm-19.list >/dev/null
          printf 'Package: *\nPin: release o=apt.llvm.org\nPin-Priority: 1001\n' |
            sudo tee /etc/apt/preferences.d/llvm-19 >/dev/null
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang-19 lld-19 llvm-19 cmake ninja-build glslang-tools \
            lftp git python3 curl pkg-config bison flex perl gcc-mingw-w64-x86-64 \
            gcc-mingw-w64-i686 g++-mingw-w64-i686
          for tool in clang clang++ lld ld.lld llvm-ar llvm-ranlib llvm-nm \
                      llvm-objcopy llvm-readelf llvm-strip; do
            sudo ln -sfn "/usr/bin/${tool}-19" "/usr/local/bin/$tool"
          done
          clang --version
          ld.lld --version
          clang --version | grep -q 'version 19\.1\.7' || {
            echo "clang must be 19.1.7 to match the validated workstation build" >&2; exit 1; }

      # Manual runs take the version input. Tag runs derive it from the tag:
      # v1.08 or v1.8 -> 01.08. Anything else fails before the build starts.
      - name: Resolve package version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            version=$INPUT_VERSION
          elif [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" =~ ^v([0-9]{1,2})\.([0-9]{1,2})$ ]]; then
            version=$(printf '%02d.%02d' "$((10#${BASH_REMATCH[1]}))" "$((10#${BASH_REMATCH[2]}))")
          else
            echo "cannot derive a package version from ${GITHUB_EVENT_NAME} ref '${GITHUB_REF_NAME}';" \
                 "tags must look like v1.08" >&2
            exit 1
          fi
          [[ "$version" =~ ^[0-9]{2}\.[0-9]{2}$ ]] || {
            echo "package version '$version' must be NN.NN, e.g. 01.08" >&2; exit 1;
          }
          echo "PKG_VERSION=$version" >> "$GITHUB_ENV"
          echo "package version: $version"

      - name: Attach private build cache
        run: scripts/ci/prepare-runner.sh

      - name: Check build prerequisites
        run: scripts/prereqs.sh

      # ⚠ Without /app0/dev.conf the title sends its app log nowhere: ps5log
      # reads it before /data is readable, so the copy in /data/homebrew is not
      # enough (scripts/build-app-ps4.sh). Local builds take it from the
      # gitignored build/devconf/dev.conf; CI writes it from the repository
      # variable PS4_LOG_SERVER (the ps5logd host). CI 01.15 had none, so its
      # Half-Life and FNV quit crashes on 2026-11-05 left no app log.
      - name: Point the title's app log at the log host
        env:
          PS4_LOG_SERVER: ${{ vars.PS4_LOG_SERVER }}
        run: |
          set -euo pipefail
          if [[ -z "$PS4_LOG_SERVER" ]]; then
            echo "::warning::PS4_LOG_SERVER is not set: this package will send no app log"
            exit 0
          fi
          mkdir -p build/devconf
          printf '%s\n' DEV_ENABLED=1 "DEV_SERVER=$PS4_LOG_SERVER" DEV_PORT=9300 DEV_UDP=0 \
            DEV_CONNECT_TIMEOUT_MS=500 DEV_SEND_TIMEOUT_MS=200 DEV_TAG=orbis-win-ci \
            > build/devconf/dev.conf

      # ABI-v4, built the way GLDS10043 01.06 was validated on hardware
      # (2026-11-05). build-abi4-package.sh fails the job if any parity gate
      # (relocation stub, Vulkan surface, display, PS4 RADV, PRX exports,
      # kernelbase diagnostics, signal-mask values) or pkg_validate fails.
      # Do not set PW_SHARED_LIBC here: the validated stub and app link libc
      # statically. See docs/UPSTREAM-SYNC-PLAYBOOK.md.
      - name: Build and gate the ABI-v4 relocatable package
        env:
          TITLE_ID: ${{ inputs.title_id || 'GLDS10043' }}
          TITLE: ${{ inputs.title || 'Orbis Wine ABI-v4' }}
          PW_SPLIT_RUNTIME: "0"
          PW_MODULE_STUBS_DIR: ${{ github.workspace }}/build/openorbis-module-stubs
          PS4_PKGTOOL_OPENSSL_LIB: /orbis-cache/deps/openssl11/lib
          OUT: ${{ runner.temp }}/orbis-win-abi4
        run: |
          set -euo pipefail
          scripts/sync-toolchain.sh
          scripts/build-openorbis-module-stubs.sh
          scripts/ci/build-abi4-package.sh

      - name: Collect package, gate reports and provenance
        env:
          PW_MODULE_STUBS_DIR: ${{ github.workspace }}/build/openorbis-module-stubs
          OUT: ${{ runner.temp }}/orbis-win-abi4
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/orbis-win-artifacts"
          app_pkg=$(find "$OUT/app" -maxdepth 1 -type f -name '*.pkg' -print -quit)
          test -s "$app_pkg"
          cp "$app_pkg" "$OUT/parity.txt" "$OUT/pkg_validate.txt" "$RUNNER_TEMP/orbis-win-artifacts/"
          {
            cat "$OUT/BUILD-MANIFEST.txt"
            echo "root_ref=${GITHUB_REF}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "module_stub_source=OpenOrbis-PS4-Toolchain@0a1aaf9dd4a92695538bdeb09fb056d06dd11725 (GPL-3.0)"
            echo "libc_stub_sha256=$(sha256sum "$PW_MODULE_STUBS_DIR/libc.prx" | cut -d' ' -f1)"
            echo "fios2_stub_sha256=$(sha256sum "$PW_MODULE_STUBS_DIR/libSceFios2.prx" | cut -d' ' -f1)"
            echo "mesa_dirty_diff_sha256=$(git -C mesa-build/mesa-ps4 diff --binary | sha256sum | cut -d' ' -f1)"
            echo "cache_manifest:"; sed 's/^/  /' /orbis-cache/deps/manifest.txt
          } > "$RUNNER_TEMP/orbis-win-artifacts/BUILD-MANIFEST.txt"
          cat "$RUNNER_TEMP/orbis-win-artifacts/BUILD-MANIFEST.txt"

      - uses: actions/upload-artifact@v4
        with:
          # Branch names can contain '/', which is not valid in artifact names.
          name: orbis-win-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/orbis-win-artifacts/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
